name: Update SPX Altimeter data

on:
  schedule:
    # 22:30 UTC = 06:30 JST = well after the US market close (16:00 ET / 20:00-21:00 UTC
    # depending on DST). Gives Yahoo's daily bar time to finalize.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: spx-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest S&P 500 data and rebuild data/*.json
        run: python fetch_public.py

      - name: Commit and push if data changed
        run: |
          git config user.name "spx-altimeter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/weeks.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily update $(date -u +%Y-%m-%d)"
            git push
          fi
